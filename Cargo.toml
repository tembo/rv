[package]
name = "rv"
version = "1.0.0"
edition = "2024"
description = "A unified code review CLI for GitHub, GitLab, and Bitbucket"
license = "MIT"
repository = "https://github.com/tembo/rv"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
url = "2.5"
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.20"
